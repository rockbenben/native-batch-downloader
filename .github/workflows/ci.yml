name: CI

# Two stages.
#   gates   — every check that must pass before anything ships.
#   release — runs only for a tag, only after the gates passed, and only when
#             the tag is proven to match manifest.json.
#
# The tag-vs-manifest check lives in its own job so a mistyped tag fails in
# seconds instead of after the whole gate suite. Every release step is
# guarded by `github.ref_type == 'tag'`, so a manual run on a branch can only
# re-check the code — it can never touch a release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual re-run of the gates.
  workflow_dispatch:

# Least privilege by default: the gates only read the repo. The release job
# asks for write access on its own, for its own steps.
permissions:
  contents: read

# A newer push to the same ref supersedes in-flight gate runs; a tag run is a
# release — never cancelled mid-zip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  tag-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(python -c "import json;print(json.load(open('manifest.json'))['version'])")"
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag but manifest.json says $manifest"
            exit 1
          fi

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: JS syntax
        run: |
          node --check background.js
          node --check popup.js
          node --check dashboard.js

      - name: locale parity, placeholders, frozen keys
        run: python scripts/i18n-check.py

      - name: package gate (runtime file + asset cross-references)
        run: |
          python scripts/package.py
          rm -f native-batch-downloader-v*.zip

      - name: behavior tests (popup/dashboard/background over CDP)
        run: node scripts/run-tests.mjs

      - name: display-font coverage of the committed subsets
        run: |
          pip install -r requirements-dev.txt
          python scripts/subset-display-fonts.py --check

      - name: display-font source coverage
        # The rebuild is network-bound (it pulls ~40 MB of Noto/Google sources)
        # and only proves the SOURCE fonts can render the current strings.
        # --check above already proves the committed subsets cover them, and
        # the author re-bakes locally, so this only runs for a release —
        # where a font that cannot render the shipped copy would matter most.
        if: github.ref_type == 'tag'
        run: |
          python scripts/subset-display-fonts.py
          # the gate is glyph coverage, not recompased bytes — ship what is committed
          git checkout -- fonts/

      - name: release notes exist for the current version
        # Both changelogs must carry a section for the version in
        # manifest.json. Checking it on every push catches a version bump
        # without its changelog sections here, not at release time.
        run: python scripts/release-notes.py --check

  release:
    needs: [tag-version, gates]
    if: github.ref_type == 'tag' && needs.tag-version.result == 'success' && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: build the store zip
        run: python scripts/package.py

      - name: build the release notes
        run: python scripts/release-notes.py "${GITHUB_REF_NAME#v}" > notes.md

      - name: publish the GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          # Idempotent: a re-run of the same tag (a retried run, or a tag
          # deleted and re-pushed) updates the existing release instead of
          # failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" native-batch-downloader-v*.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" native-batch-downloader-v*.zip \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
