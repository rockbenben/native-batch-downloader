<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Native Batch Downloader — dev harness</title>
<!-- Single source of truth: the real popup stylesheet, no copy-paste. -->
<link rel="stylesheet" href="../popup.css">
</head>
<body class="popup">

<main class="cabinet">

  <header class="hdr">
    <span class="chute" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M12 4v10"/>
        <path d="M7.5 10.5 12 15l4.5-4.5"/>
        <path d="M5 20h14"/>
      </svg>
    </span>
    <h1 id="titleText"></h1>
    <button class="dashdoor" id="dashBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
    </button>
    <span class="led" aria-hidden="true"></span>
  </header>

  <textarea id="urls" spellcheck="false"></textarea>

  <div class="controls">
    <div class="dial">
      <label id="concLabel" for="concurrency"></label>
      <input type="number" id="concurrency" value="10" min="1" max="200" step="1">
    </div>
    <div class="dial">
      <label id="delayLabel" for="delay"></label>
      <div class="with-unit">
        <input type="number" id="delay" value="0" min="0" max="10000" step="100">
        <span class="unit">ms</span>
      </div>
    </div>
    <div class="dial" id="folderDial">
      <label id="folderLabel" for="folder"></label>
      <input type="checkbox" id="folder" checked>
    </div>
  </div>

  <div class="btn-row">
    <button id="startBtn"></button>
    <button id="stopBtn" disabled></button>
  </div>

  <div class="meter">
    <div class="belt" id="belt" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="fill" id="bar"></div>
    </div>
  </div>

  <div class="stats">
    <div class="tile"><b id="total">0</b><span id="lblTotal"></span></div>
    <div class="tile ok"><b id="ok">0</b><span id="lblOk"></span></div>
    <button class="tile fail" id="tileFail" type="button" aria-disabled="true"><b id="fail">0</b><span id="lblFail"></span></button>
    <div class="tile wait"><b id="wait">0</b><span id="lblWait"></span></div>
  </div>

  <div class="resume-bar" id="resumeBar" hidden>
    <span id="resumeText"></span>
    <button id="resumeBtn" type="button"></button>
    <button id="resumeX" type="button"></button>
  </div>

  <button id="retryBtn" class="retry" hidden></button>
  <button id="popupResume" class="retry" hidden></button>

  <div id="log" role="log" aria-live="polite"></div>

</main>

<script>
  // chrome.* stub so the REAL popup.js runs in a plain tab.
  // ?draft=<text> seeds storage.session; window.fakeSession is inspectable.
  const q = new URLSearchParams(location.search);
  window.fakeSession = {};
  if (q.get("draft")) window.fakeSession.draft = q.get("draft");
  // ?state=<urlencoded JSON> drives renderState for previews/tests.
  if (q.get("state")) window.fakeState = JSON.parse(q.get("state"));
  window.sent = [];
  const MSGS = { extName: "Native Batch Downloader", title: "Native Batch Downloader", placeholder: "Paste download URLs, one per line", concurrency: "Concurrency", delay: "Delay", subfolder: "Save to subfolder", subfolderTip: "tip", start: "Start Download", stop: "Stop", retryFailed: "Retry Failed", total: "Total", success: "Done", failed: "Failed", waiting: "Waiting", noUrls: "Paste at least one URL starting with http:// or https://", urlsAria: "Download links", progressAria: "Download progress", pause: "Pause", resume: "Resume", resumed: "Resumed", paused: "Paused", all: "All", viewDetails: "View failure details", openDash: "Open batch dashboard", copyTip: "Copy link", menuAddLink: "Add link to batch", resumeAsk: "Unfinished batch: $1 links left", resumeDismiss: "Dismiss", dashEmpty: "No batch yet — paste links in the popup and press Start", "@@bidi_dir": "ltr", "@@ui_locale": "en" };
  window.chrome = {
    i18n: { getMessage: (k, subs) => { let s = MSGS[k] || ""; (subs || []).forEach((v, i) => { s = s.replace("$" + (i + 1), v); }); return s; } },
    storage: {
      sync: {
        get: (defaults, cb) => cb({ ...defaults }),
        set: (v) => (window.savedSettings = v),
      },
      session: {
        get: (key, cb) => cb({ ...window.fakeSession }),
        set: (obj) => Object.assign(window.fakeSession, obj),
        remove: (key) => delete window.fakeSession[key],
      },
      local: {
        get: (key, cb) => cb({}),
        set: () => {},
        remove: () => {},
      },
    },
    contextMenus: { create: () => {}, onClicked: { addListener: () => {} } },
    tabs: { create: (o) => window.sent.push({ cmd: "openTab", ...o }) },
    downloads: { search: (q, cb) => cb([]) },
    runtime: {
      lastError: null,
      onMessage: { addListener: () => {} },
      sendMessage: (msg, cb) => {
        window.sent.push(msg);
        if (msg.cmd === "getState" && cb) cb({ state: window.fakeState || { running: false, paused: false, stats: { total: 0, ok: 0, fail: 0 }, failed: 0, log: [], dropped: 0, pendingResume: 0 } });
        if (msg.cmd === "getFull" && cb) cb({ state: window.fakeFull || { running: false, paused: false, stats: { total: 0, ok: 0, fail: 0 }, failed: 0, log: [], dropped: 0, pendingResume: 0, entries: {} } });
        if (msg.cmd === "bytes" && cb) cb({ received: 0, total: 0 });
        if (cb && msg.cmd !== "getState" && msg.cmd !== "getFull" && msg.cmd !== "bytes") cb({ ok: true });
      },
      getURL: (p) => p,
    },
  };
</script>
<script src="../popup.js"></script>
</body>
</html>
